<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小谷农场</title>
<style>
body{margin:0;background:#2b2118;color:#fff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#wrap{position:relative;width:min(100vw,calc((100vh - 70px)*1.3333),960px);margin-top:8px}
canvas{width:100%;height:auto;display:block;background:#000;border:4px solid #6b4a2b;border-radius:6px;box-sizing:border-box}
#shop{position:absolute;left:14%;right:14%;top:8%;background:rgba(60,40,20,.97);border:3px solid #c99a5b;border-radius:8px;padding:14px 18px;display:none;font-size:15px}
#shop h2{margin:0 0 6px}
#shop .row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:6px 8px;background:rgba(255,255,255,.07);border-radius:6px}
#shop small{color:#e8d3a8}
button{background:#c99a5b;border:0;color:#2b1a0a;font-weight:bold;padding:6px 14px;border-radius:5px;cursor:pointer;font-size:14px}
button:hover{background:#e3b878}
#touch{display:none;width:min(100vw,960px);box-sizing:border-box;padding:10px 12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#touch button{width:44px;height:44px;border-radius:10px;font-size:18px;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button.on,#touch button:active{background:#ffe066}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.act{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tb{display:flex;gap:6px}
#touch .use{width:100%;height:52px;font-size:18px;border-radius:26px}
#touch .sm{font-size:13px}
@media (pointer:coarse){#touch{display:flex;justify-content:space-between;align-items:flex-end}}
@media (pointer:coarse) and (orientation:landscape){
  #touch{position:fixed;left:0;right:0;bottom:0;width:auto;pointer-events:none;padding:0 14px 10px}
  #touch button{pointer-events:auto;opacity:.78}
}
#help{max-width:900px;padding:8px 12px;font-size:13px;color:#e8d3a8;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="480"></canvas>
  <div id="shop"></div>
</div>
<div id="touch">
  <div class="dpad">
    <span></span><button data-k="w">▲</button><span></span>
    <button data-k="a">◀</button><span></span><button data-k="d">▶</button>
    <span></span><button data-k="s">▼</button><span></span>
  </div>
  <div class="act">
    <div class="tb"><button data-t="1">⛏</button><button data-t="2">💧</button><button data-t="3">🌱</button><button data-t="4">🎣</button></div>
    <div class="tb"><button class="sm" data-p="q">换种</button><button class="sm" data-p="g">送礼</button><button class="sm" data-p="e">互动</button><button class="sm" data-p="m">声音</button></div>
    <button class="use" data-p=" ">使用</button>
  </div>
</div>
<div id="help">
  <b>WASD / 方向键</b> 移动　<b>1-4</b> 切换工具（锄头/水壶/种子/鱼竿）　<b>Q</b> 切换种子　<b>空格 / J</b> 使用工具、收获<br>
  <b>E</b> 互动（房门睡觉 / 木箱出售 / 商店门购买 / 和阿鹿聊天）　<b>G</b> 送礼物给阿鹿　<b>M</b> 声音开关
  <button onclick="if(confirm('确定重新开始吗？存档会被清除。')){localStorage.removeItem('tinyvalley');location.reload()}">重新开始</button>
</div>
<script>
const W=20,H=15,TS=32;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const shopEl=document.getElementById('shop');
const SEASONS=['春','夏','秋','冬'];
const CROPS={
  turnip:{n:'萝卜',s:[0,2],d:3,seed:20,sell:50,c:'#efe6f5',leaf:'#4caf50'},
  strawberry:{n:'草莓',s:[0,1],d:5,seed:60,sell:130,c:'#e53935',leaf:'#43a047'},
  tomato:{n:'番茄',s:[1],d:4,seed:50,sell:110,c:'#ef5350',leaf:'#388e3c'},
  pumpkin:{n:'南瓜',s:[2],d:6,seed:90,sell:240,c:'#fb8c00',leaf:'#2e7d32'}
};
const SEEDKEYS=Object.keys(CROPS);
const FISH=[{n:'鲫鱼',p:40,w:4},{n:'鲤鱼',p:70,w:3},{n:'鲈鱼',p:110,w:2},{n:'金鱼',p:160,w:1}];
const TREES=[[8,1],[9,1],[12,2],[0,7],[0,8],[19,5],[1,13],[12,14],[18,14],[13,6]];
const TOOLS=['锄头','水壶','种子','鱼竿'];
const TOOLICON=['⛏','💧','🌱','🎣'];
const LINES={
  0:['春天到了，萝卜最好种啦！','听说今年的草莓会很甜。','记得每天给作物浇水哦。'],
  1:['夏天好热，池塘边最凉快。','番茄只在夏天长，别错过。','晚上的萤火虫真好看。'],
  2:['秋天是南瓜的季节！','落叶好美，适合散步。','冬天前把作物都收掉吧。'],
  3:['冬天地里种不了东西……去钓鱼吧。','好冷，我想喝热汤。','雪天真安静。']
};

function newState(){return{day:1,season:0,year:1,gold:200,energy:100,t:360,seeds:{turnip:5,strawberry:0,tomato:0,pumpkin:0},items:{},tiles:{},fr:0,talked:false,gifted:false,weather:0,chickens:0,eggs:0,muted:false,ms:{}}}
function load(){try{const s=localStorage.getItem('tinyvalley');return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem('tinyvalley',JSON.stringify(S))}catch(e){}}
let S=load()||newState();
{const d0=newState();for(const k in d0)if(S[k]===undefined)S[k]=d0[k];for(const k in d0.seeds)if(S.seeds[k]===undefined)S.seeds[k]=0}

const P={x:4.5*TS,y:4.5*TS,fx:0,fy:1,moving:false,anim:0,swing:0};
const N={x:9*TS+16,y:5*TS+24,tx:9*TS+16,ty:5*TS+24,wait:1,dir:1};
let tool=0,selSeed=0,fishing=null,fade=null,shopOpen=false,msgText='',msgT=0;

function msg(t,s=3){msgText=t;msgT=s}
function solid(x,y){
  if(x<0||y<0||x>=W||y>=H)return true;
  if(x>=1&&x<=3&&y<=2)return true;
  if(x>=15&&x<=18&&y<=2)return true;
  if(x>=14&&x<=18&&y>=8&&y<=12)return true;
  if(x==5&&y==3)return true;
  if(x>=15&&x<=16&&y>=13&&y<=14)return true;
  return TREES.some(t=>t[0]==x&&t[1]==y);
}
function isWater(x,y){return x>=14&&x<=18&&y>=8&&y<=12}
function blocked(px,py){
  const x0=Math.floor((px-9)/TS),x1=Math.floor((px+9)/TS),y0=Math.floor((py-6)/TS),y1=Math.floor((py+6)/TS);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(solid(x,y))return true;
  return false;
}
function target(){return[Math.floor(P.x/TS)+P.fx,Math.floor(P.y/TS)+P.fy]}
function itemName(k){return k[0]=='h'?CROPS[k.slice(2)].n:k[0]=='e'?'鸡蛋':FISH[+k.slice(2)].n}
function itemPrice(k){return k[0]=='h'?CROPS[k.slice(2)].sell:k[0]=='e'?35:FISH[+k.slice(2)].p}
function addItem(k){S.items[k]=(S.items[k]||0)+1}
function npcNear(){return Math.hypot(P.x-N.x,P.y-N.y)<46}

/* ---------- 输入 ---------- */
const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  const rep=e.repeat;keys[k]=true;
  if(!rep)onPress(k);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function onPress(k){
  if(fade)return;
  if(shopOpen){if(k=='escape'||k=='e')closeShop();return}
  if(k>='1'&&k<='4'){tool=+k-1;if(fishing)fishing=null}
  else if(k=='q'){selSeed=(selSeed+1)%SEEDKEYS.length;tool=2;msg('选择种子：'+CROPS[SEEDKEYS[selSeed]].n,1.5)}
  else if(k==' '||k=='j')useTool();
  else if(k=='e')interact();
  else if(k=='g')gift();
  else if(k=='m'){S.muted=!S.muted;msg(S.muted?'声音已关闭':'声音已开启',1.5);if(!S.muted)startAudio()}
}

/* ---------- 行为 ---------- */
function useTool(){
  if(fishing){
    if(fishing.st=='bite'){
      let tot=FISH.reduce((a,f)=>a+f.w,0),r=Math.random()*tot,i=0;
      for(;i<FISH.length;i++){r-=FISH[i].w;if(r<=0)break}
      i=Math.min(i,FISH.length-1);
      addItem('f_'+i);msg('钓到了一条'+FISH[i].n+'！（$'+FISH[i].p+'）',3);
      snd('catch');burst(fishing.tx*TS+16,fishing.ty*TS+16,'#bfe6ff',12);floater(fishing.tx*TS+16,fishing.ty*TS,'+'+FISH[i].n);
    }else msg('收竿太早了……',2);
    fishing=null;return;
  }
  const[tx,ty]=target(),key=tx+','+ty,t=S.tiles[key];
  P.swing=0.25;
  if(t&&t.c&&t.c.age>=CROPS[t.c.k].d){
    addItem('h_'+t.c.k);msg('收获了'+CROPS[t.c.k].n+'！',2);
    burst(tx*TS+16,ty*TS+12,'#fff59d',10);floater(tx*TS+16,ty*TS+4,'+'+CROPS[t.c.k].n);
    t.c=null;S.ms.h=1;snd('harvest');checkMs();return;
  }
  if(S.energy<=0){msg('没力气了，去房门口睡觉吧（E）',3);return}
  if(tool==0){
    if(!solid(tx,ty)&&!t&&!isPath(tx,ty)){S.tiles[key]={w:0,c:null};S.energy-=2;burst(tx*TS+16,ty*TS+20,'#8d6038',9);snd('till')}
    else if(isPath(tx,ty))msg('石板路上不能翻土',1.5);
  }else if(tool==1){
    if(t){t.w=1;S.energy-=1;burst(tx*TS+16,ty*TS+16,'#7fc4ff',10);snd('water')}
  }else if(tool==2){
    if(t&&!t.c){
      const k=SEEDKEYS[selSeed],c=CROPS[k];
      if(S.seeds[k]<=0)msg('没有'+c.n+'种子了，去商店买吧',2);
      else if(!c.s.includes(S.season))msg(c.n+'不适合在'+SEASONS[S.season]+'季种植',2.5);
      else{t.c={k:k,age:0};S.seeds[k]--;S.energy-=1;burst(tx*TS+16,ty*TS+20,'#8bc34a',7);snd('plant')}
    }else if(!t)msg('先用锄头翻土',1.5);
  }else if(tool==3){
    if(isWater(tx,ty)){fishing={st:'wait',t:0,w:1+Math.random()*3,tx,ty};S.energy-=3}
    else msg('对着池塘抛竿',1.5);
  }
}
function interact(){
  if(npcNear()){talk();return}
  const[tx,ty]=target();
  if(tx==2&&ty==2){fade={t:0,passed:false,applied:false};msg('晚安……',2);snd('sleep');return}
  if(tx>=15&&tx<=16&&ty>=13&&ty<=14){coop();return}
  if(tx==5&&ty==3){sell();return}
  if(tx==16&&ty==2){shopOpen=true;renderShop();shopEl.style.display='block';return}
}
function coop(){
  if(S.chickens==0){msg('鸡舍还是空的，去商店买小鸡吧',2.5);return}
  if(S.eggs>0){S.items['e_egg']=(S.items['e_egg']||0)+S.eggs;msg('收集了 '+S.eggs+' 个鸡蛋',2.5);S.eggs=0;snd('harvest')}
  else msg('今天的鸡蛋已经收完了（共 '+S.chickens+' 只小鸡）',2.5);
}
function checkMs(){
  const list=[['harvest',S.ms.h,'第一次收获！你已经是个农夫了'],['g1000',S.gold>=1000,'金币突破 $1000，农场开始赚钱了'],['chick',S.chickens>=1,'你养了第一只小鸡'],['fr10',S.fr>=10,'你和阿鹿成了最好的朋友'],['g5000',S.gold>=5000,'金币突破 $5000，农场大亨！']];
  for(const m of list)if(m[1]&&!S.ms[m[0]]){S.ms[m[0]]=1;msg('🏆 '+m[2],4.5);snd('win');break}
}
function sell(){
  let tot=0,n=0;
  for(const k in S.items){tot+=S.items[k]*itemPrice(k);n+=S.items[k]}
  if(!n){msg('出货箱：背包里没有可卖的东西',2);return}
  S.gold+=tot;S.items={};floater(5*TS+16,3*TS,'+$'+tot);snd('coin');burst(5*TS+16,3*TS+10,'#ffd54f',12);msg('卖出 '+n+' 件，获得 $'+tot,3);
}
function talk(){
  const ls=LINES[S.season];let l=ls[Math.random()*ls.length|0];
  if(S.fr>=10)l='你是我最好的朋友！❤';
  else if(S.fr>=5&&Math.random()<.5)l='和你聊天真开心！';
  if(!S.talked){S.talked=true;S.fr=Math.min(10,S.fr+1)}
  msg('阿鹿：'+l+'  (好感 '+S.fr+'/10)',4);snd('talk');checkMs();
}
function gift(){
  if(!npcNear())return;
  if(S.gifted){msg('阿鹿：今天已经收到礼物啦，谢谢！',2.5);return}
  const k=Object.keys(S.items).find(k=>S.items[k]>0);
  if(!k){msg('背包里没有可以送的东西',2);return}
  S.items[k]--;if(!S.items[k])delete S.items[k];
  S.gifted=true;S.fr=Math.min(10,S.fr+2);
  msg('你送了一个'+itemName(k)+'。阿鹿很开心！(好感 '+S.fr+'/10)',3.5);snd('talk');checkMs();
}
function renderShop(){
  let h='<h2>🏪 杂货铺</h2><div>金币：$'+S.gold+'</div>';
  for(const k of SEEDKEYS){
    const c=CROPS[k];
    h+=`<div class="row"><span>${c.n}种子 · $${c.seed}（持有 ${S.seeds[k]}）<br><small>${c.s.map(i=>SEASONS[i]).join('/')}季 · ${c.d}天成熟 · 售价 $${c.sell}</small></span><button onclick="buy('${k}')">购买</button></div>`;
  }
  h+=`<div class="row"><span>小鸡 · $150（${S.chickens}/4）<br><small>每天下一个蛋，到鸡舍收取 · 鸡蛋 $35</small></span><button onclick="buy('chicken')">购买</button></div>`;
  h+='<div style="text-align:right"><button onclick="closeShop()">离开</button></div>';
  shopEl.innerHTML=h;
}
function buy(k){
  if(k=='chicken'){if(S.chickens<4&&S.gold>=150){S.gold-=150;S.chickens++;snd('buy');checkMs();renderShop()}return}
  if(S.gold>=CROPS[k].seed){S.gold-=CROPS[k].seed;S.seeds[k]++;snd('buy');renderShop()}
}
function closeShop(){shopOpen=false;shopEl.style.display='none'}

function endDay(passed){
  for(const k in S.tiles){const t=S.tiles[k];if(t.c&&t.w)t.c.age++;t.w=0}
  S.day++;
  if(S.day>28){S.day=1;S.season++;if(S.season>3){S.season=0;S.year++}}
  let wilted=0;
  for(const k in S.tiles){const t=S.tiles[k];if(t.c&&!CROPS[t.c.k].s.includes(S.season)){t.c=null;wilted++}}
  const r=Math.random();
  S.weather=S.season==3?(r<.35?2:0):(r<(S.season==0?.3:.2)?1:0);
  if(S.weather==1)for(const k in S.tiles)S.tiles[k].w=1;
  S.t=360;S.energy=passed?70:100;S.talked=false;S.gifted=false;
  S.eggs=Math.min(12,S.eggs+S.chickens);
  fishing=null;
  save();
  let m=S.day==1?('新的一季：'+SEASONS[S.season]+'季开始了！'):('第'+S.day+'天');
  if(wilted)m+='　有 '+wilted+' 株作物因换季枯萎了';
  else if(S.weather==1)m+='　今天下雨，作物自动浇水';
  msg(m,4);
}

/* ---------- 更新 ---------- */
function update(dt){
  if(msgT>0)msgT-=dt;
  if(P.swing>0)P.swing-=dt;
  updateFx(dt);updateChickens(dt);
  if(fade){
    fade.t+=dt;
    if(!fade.applied&&fade.t>=0.8){fade.applied=true;endDay(fade.passed)}
    if(fade.t>=1.6)fade=null;
    return;
  }
  if(shopOpen)return;
  S.t+=dt*6;
  if(S.t>=1560){fade={t:0,passed:true,applied:false};msg('太晚了，你在地上睡着了……',3);return}
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])mx--;
  if(keys['d']||keys['arrowright'])mx++;
  if(keys['w']||keys['arrowup'])my--;
  if(keys['s']||keys['arrowdown'])my++;
  P.moving=!!(mx||my);
  if(P.moving){
    const l=Math.hypot(mx,my);
    if(mx&&!my){P.fx=mx;P.fy=0}else if(my&&!mx){P.fx=0;P.fy=my}
    const sp=110*dt;
    const nx=P.x+mx/l*sp;if(!blocked(nx,P.y))P.x=nx;
    const ny=P.y+my/l*sp;if(!blocked(P.x,ny))P.y=ny;
    P.anim+=dt*10;
    if(fishing)fishing=null;
  }
  if(fishing){
    fishing.t+=dt;
    if(fishing.st=='wait'&&fishing.t>=fishing.w){fishing.st='bite';fishing.t=0;snd('bite')}
    else if(fishing.st=='bite'&&fishing.t>0.9){fishing=null;msg('鱼跑了……',2)}
  }
  // NPC
  const dx=N.tx-N.x,dy=N.ty-N.y,d=Math.hypot(dx,dy);
  N.mv=d>1;
  if(d>1){const s=Math.min(40*dt,d);N.x+=dx/d*s;N.y+=dy/d*s;if(Math.abs(dx)>1)N.dir=dx>0?1:-1}
  else{
    N.wait-=dt;
    if(N.wait<=0){
      N.wait=1.5+Math.random()*3;
      const o=[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0];
      const nx=Math.floor(N.x/TS)+o[0],ny=Math.floor(N.y/TS)+o[1];
      if(nx>=6&&nx<=13&&ny>=3&&ny<=6&&!solid(nx,ny)&&!S.tiles[nx+','+ny]){N.tx=nx*TS+16;N.ty=ny*TS+24}
    }
  }
}

/* ---------- 绘制 ---------- */
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295}
function rr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function panel(x,y,w,h){ctx.fillStyle='rgba(50,30,15,.85)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#c99a5b';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2)}
function text(s,x,y,c,size,al){ctx.font=(size||13)+'px system-ui,"Microsoft YaHei",sans-serif';ctx.fillStyle=c||'#fff';ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}

/* ----- 像素素材工具：先在小画布上逐像素绘制，再放大 2 倍显示 ----- */
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function mkR(g){return function(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}}
function blob(R,cx,cy,r,col){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.5)R(cx+x,cy+y,1,1,col)}
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return function(){s=s*16807%2147483647;return s/2147483647}}
const O_='#2a1a12';

/* 人物：4 个朝向 × 3 帧（站立 / 左脚 / 右脚） */
function makePerson(c){
  const out=[];
  for(let d=0;d<4;d++){
    out[d]=[];
    for(let f=0;f<3;f++){
      const k=cvs(12,20),g=k.getContext('2d'),R=mkR(g);
      const lL=f==1?1:0,lR=f==2?1:0;
      // 腿和鞋
      R(3,16,3,3-lL,c.pants);R(6,16,3,3-lR,c.pants);
      R(3,19-lL,3,1,c.shoe);R(6,19-lR,3,1,c.shoe);
      // 身体
      R(2,10,8,7,O_);R(3,11,6,5,c.shirt);R(3,15,6,1,c.shirtD);

  if(msgT>0&&msgText){
    ctx.font='14px system-ui,"Microsoft YaHei",sans-serif';
    const w=Math.min(620,ctx.measureText(msgText).width+28);
    panel(320-w/2,480-96,w,30);text(msgText,320,480-76,'#fff',14,'center');
  }
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  drawGround();drawPond();drawTiles();drawBuildings();
  if(!shopOpen){
    const tg=target(),tx=tg[0],ty=tg[1],a=.55+Math.sin(performance.now()/200)*.25;
    ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=2;ctx.strokeRect(tx*TS+2,ty*TS+2,TS-4,TS-4);
  }
  if(fishing){
    const bx=fishing.tx*TS+16,by=fishing.ty*TS+16+(fishing.st=='bite'?Math.sin(performance.now()/40)*2:0);
    ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P.x+P.fx*10,P.y-18);ctx.lineTo(bx,by);ctx.stroke();
    circ(bx,by,4,'#e53935');
    if(fishing.st=='bite')text('!',bx,by-12,'#ffeb3b',22,'center');
  }
  drawWorld();
  drawSmoke();
  const night=Math.max(0,Math.min(1,(S.t-1080)/480));
  const a=night*.55+(S.weather==1?.15:0);
  if(a>0){ctx.fillStyle='rgba(20,20,70,'+a+')';ctx.fillRect(0,0,640,480)}
  if(night>.15){
    ctx.fillStyle='rgba(255,224,138,'+Math.min(.9,night*1.2)+')';
    ctx.fillRect(46,66,16,16);ctx.fillRect(102,66,16,16);ctx.fillRect(480+38*2,68,40,18);
  }
  const now=performance.now()/1000;
  if(S.weather==1){
    ctx.strokeStyle='rgba(190,215,255,.6)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<90;i++){const x=(i*71.3+now*60)%660-10,y=(i*37.7+now*420)%500;ctx.moveTo(x,y);ctx.lineTo(x-3,y+10)}
    ctx.stroke();
  }else if(S.weather==2){
    ctx.fillStyle='#fff';
    for(let i=0;i<80;i++){const x=Math.abs((i*83.1+Math.sin(now+i)*20))%640,y=(i*41.9+now*50)%480;ctx.fillRect(x,y,2,2)}
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l*2));rr(p.x-1,p.y-1,3,3,p.c)}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.max(0,Math.min(1,f.l*1.5));text(f.s,f.x,f.y,'#fff7c2',14,'center')}
  ctx.globalAlpha=1;
  drawHUD();
  if(fade){
    const al=fade.t<.8?fade.t/.8:Math.max(0,(1.6-fade.t)/.8);
    ctx.fillStyle='rgba(0,0,0,'+al+')';ctx.fillRect(0,0,640,480);
  }
}

/* ---------- 小鸡和鸡舍 ---------- */
const CHSPR=[0,1].map(function(f){
  const k=cvs(12,9),g=k.getContext('2d'),R=mkR(g);
  R(2,3,7,4,'#fff9ec');R(0,2,3,3,'#fff9ec');R(3,4,3,2,'#e8e0cc');
  R(8,f?2:1,3,3,'#fff9ec');R(9,f?1:0,2,1,'#e53935');R(11,f?3:2,1,1,'#ffb300');R(9,f?3:2,1,1,'#222');
  R(4,7,1,2,'#ffb300');R(f?7:6,7,1,2,'#ffb300');
  return k;
});
function drawChicken(c){
  const spr=CHSPR[((performance.now()/(c.mv?140:420)+c.ph)|0)%2];
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(c.x,c.y+1,8,3,0,0,7);ctx.fill();
  ctx.save();ctx.translate(c.x,c.y);if(c.dir<0)ctx.scale(-1,1);
  ctx.drawImage(spr,-12,-17,24,18);ctx.restore();
}
const coopC={};
function coopSprite(sn){
  if(coopC[sn])return coopC[sn];
  const k=cvs(32,32),g=k.getContext('2d'),R=mkR(g);
  const rc=sn==3?['#e8eef2','#cfd8de']:['#a8402f','#8c3427'];
  for(let y=0;y<12;y++){const inset=Math.max(0,5-Math.floor(y/2));R(inset,y+2,32-inset*2,1,(y%3==2)?rc[1]:rc[0])}
  R(0,13,32,2,O_);
  R(2,15,28,17,'#d9b27a');for(let x=2;x<30;x+=5)R(x,15,1,17,'#b98f56');
  R(2,29,28,3,'#7a5a34');
  R(12,20,8,12,O_);R(13,21,6,11,'#4a2c14');R(15,21,1,11,'#3a2210');
  R(4,18,6,6,'#5b3a1a');R(5,19,4,4,'#f2d675');R(22,18,6,6,'#5b3a1a');R(23,19,4,4,'#f2d675');
  R(8,4,16,1,'#d0645a');
  coopC[sn]=k;return k;
}
const CH=[];
function updateChickens(dt){
  while(CH.length<S.chickens)CH.push({x:(9+Math.random()*4)*TS,y:(13.3+Math.random()*.8)*TS,tx:0,ty:0,wait:Math.random()*2,dir:1,ph:Math.random()*5,mv:false});
  for(const c of CH){
    if(!c.tx){c.tx=c.x;c.ty=c.y}
    const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
    c.mv=d>1;
    if(d>1){const s=Math.min(28*dt,d);c.x+=dx/d*s;c.y+=dy/d*s;if(Math.abs(dx)>1)c.dir=dx>0?1:-1}
    else{
      c.wait-=dt;
      if(c.wait<=0){
        c.wait=1+Math.random()*3;
        const nx=c.x+(Math.random()*80-40),ny=c.y+(Math.random()*30-15);
        if(nx>7*TS&&nx<15*TS-6&&ny>13*TS+10&&ny<15*TS-4&&!solid(Math.floor(nx/TS),Math.floor(ny/TS))){c.tx=nx;c.ty=ny}
      }
    }
  }
}

/* ---------- 声音（Web Audio 合成，无需任何素材文件） ---------- */
let AC=null,musicStep=0;
function startAudio(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();setInterval(musicTick,520)}
    if(AC.state=='suspended')AC.resume();
  }catch(e){}
}
function tone(f,dur,type,vol,delay,f2){
  if(!AC||S.muted||AC.state!='running')return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function snd(n){
  try{
    switch(n){
      case 'till':tone(140,.12,'triangle',.12,0,60);break;
      case 'water':tone(900,.15,'sine',.05,0,400);tone(700,.12,'sine',.04,.06,300);break;
      case 'plant':tone(500,.08,'square',.04);tone(700,.1,'square',.04,.07);break;
      case 'harvest':[523,659,784].forEach(function(f,i){tone(f,.14,'square',.05,i*.07)});break;
      case 'coin':tone(988,.08,'square',.05);tone(1319,.25,'square',.05,.08);break;
      case 'buy':tone(660,.07,'square',.04);tone(880,.1,'square',.04,.07);break;
      case 'bite':tone(1200,.1,'sine',.08);tone(1200,.1,'sine',.08,.12);break;
      case 'catch':[392,523,659,784].forEach(function(f,i){tone(f,.15,'triangle',.07,i*.08)});break;
      case 'talk':tone(440,.06,'triangle',.05);tone(560,.08,'triangle',.05,.06);break;
      case 'sleep':[330,262,196].forEach(function(f,i){tone(f,.5,'sine',.06,i*.25)});break;
      case 'win':[523,659,784,1047].forEach(function(f,i){tone(f,.2,'square',.05,i*.1)});break;
    }
  }catch(e){}
}
const SCALES=[[0,2,4,7,9],[0,2,4,7,9],[0,3,5,7,10],[0,2,7,9]];
function musicTick(){
  if(!AC||S.muted||AC.state!='running'||document.hidden)return;
  musicStep++;
  const sc=SCALES[S.season],base=220;
  if(musicStep%8==0)tone(base/2*Math.pow(2,sc[((musicStep/8)|0)%sc.length]/12),1.6,'sine',.04);
  if(musicStep%2==0&&Math.random()<(S.season==3?.5:.7)){
    const n=sc[(Math.random()*sc.length)|0],oct=Math.random()<.3?2:1;
    tone(base*oct*Math.pow(2,n/12),.9,'triangle',.03);
  }
}
['keydown','pointerdown'].forEach(function(ev){addEventListener(ev,startAudio)});

/* ---------- 手机触控 ---------- */
document.querySelectorAll('#touch button').forEach(function(b){
  const k=b.dataset.k,t=b.dataset.t,p=b.dataset.p;
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
  if(k){
    const on=function(e){e.preventDefault();keys[k]=true;b.classList.add('on')};
    const off=function(){keys[k]=false;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){b.addEventListener(ev,off)});
  }else{
    b.addEventListener('pointerdown',function(e){e.preventDefault();onPress(t?t:p)});
  }
});

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
msg('欢迎来到小谷农场！用 1-4 选工具，空格使用。先翻土再种萝卜吧',6);
requestAnimationFrame(loop);
